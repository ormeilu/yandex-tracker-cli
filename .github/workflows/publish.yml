# Releases on tag: binaries for three platforms, plus the same binary as a Python
# wheel.
#
# NOTE: PyPI and crates.io Trusted Publishing both match on the *filename* of
# this workflow. The publishers registered on each must name `publish.yml`;
# renaming this file breaks publishing on both.
name: publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {os: macos-latest, target: aarch64-apple-darwin}
          # Intel macOS is cross-compiled from the arm runner. Apple's linker
          # targets both architectures, and the Intel runners queue for tens
          # of minutes when they are free at all — a release that cannot start
          # is worse than one built on a host of a different architecture.
          - {os: macos-latest, target: x86_64-apple-darwin}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="ytcli-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/ytcli.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/ytcli" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64}
          - {os: ubuntu-24.04-arm, target: aarch64}
          - {os: macos-latest, target: aarch64}
          - {os: macos-latest, target: x86_64}
          - {os: windows-latest, target: x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
  release:
    needs: [binaries, wheels]
    runs-on: ubuntu-latest
    # A `workflow_dispatch` run is a rehearsal: everything is built, nothing is
    # published. A pipeline whose publishing half has never run is not a
    # pipeline, and neither is one that can only be tested by publishing.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
  pypi:
    needs: wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    # OIDC: no API token is stored anywhere. PyPI verifies the repository,
    # the workflow filename and this environment.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
  tap:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
      TAP_REPO: ormeilu/homebrew-tap
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      # A tap lives in a second repository, so this needs a token that can push
      # to it — `GITHUB_TOKEN` cannot. Without the secret the step is skipped
      # rather than failed: the tap is optional, and a release must not fail
      # because an optional channel is not set up.
      - name: Update the Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          sha() { sha256sum "dist/ytcli-$1.tar.gz" | cut -d' ' -f1; }

          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/ytcli.rb <<EOF
          # Generated by the ytcli release workflow. Edits here are overwritten.
          class Ytcli < Formula
            desc "Yandex Tracker from the command line, sized for agents"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/ytcli-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "${base}/ytcli-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/ytcli-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "${base}/ytcli-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install Dir["*/ytcli"].first => "ytcli"
              generate_completions_from_executable(bin/"ytcli", "completions", shells: [:bash, :zsh, :fish])
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/ytcli --version")
            end
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ytcli.rb
          git commit -m "ytcli ${version}" || exit 0
          git push
  crates:
    needs: binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Trusted Publishing, like PyPI: crates.io verifies this repository and
    # workflow over OIDC and hands back a token that lives for the length of
    # this job. No long-lived registry token exists to leak.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Publishing is final: a version on crates.io can be yanked but never
      # replaced. It runs after the binaries build, so a tag that does not
      # compile everywhere never reaches the registry.
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
