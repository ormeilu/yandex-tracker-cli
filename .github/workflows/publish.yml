# Releases on tag: binaries for three platforms, plus the same binary as a Python
# wheel.
#
# NOTE: PyPI and crates.io Trusted Publishing both match on the *filename* of
# this workflow. The publishers registered on each must name `publish.yml`;
# renaming this file breaks publishing on both.
name: publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
jobs:
  # The tag is what everything downstream is named after, and nothing else
  # checks that the crate agrees with it. Tagging v0.7.0 with `version = 0.6.0`
  # in Cargo.toml published a GitHub release and a Homebrew formula called
  # 0.7.0 carrying a binary that reports 0.6.0, while crates.io and PyPI
  # refused it as a version they already had. That is a release half out of the
  # door, and it costs one job to make it impossible.
  #
  # It runs on `workflow_dispatch` too, where there is no tag: the check is
  # skipped from inside rather than by a job-level `if`, because a skipped job
  # skips everything that needs it.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: The tag and Cargo.toml must agree
        run: |
          if [ "${{ github.ref_type }}" != tag ]; then
            echo "not a tag; nothing to check"
            exit 0
          fi
          tagged="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$tagged" != "$crate" ]; then
            echo "tag v$tagged does not match Cargo.toml $crate" >&2
            exit 1
          fi
          echo "v$tagged"
  binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {os: macos-latest, target: aarch64-apple-darwin}
          # Intel macOS is cross-compiled from the arm runner. Apple's linker
          # targets both architectures, and the Intel runners queue for tens
          # of minutes when they are free at all — a release that cannot start
          # is worse than one built on a host of a different architecture.
          - {os: macos-latest, target: x86_64-apple-darwin}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    # Secrets cannot be read from a step `if:`, so they are lifted into the job
    # environment and the macOS signing steps test those. Absent, they are empty
    # strings and every signing step is skipped: a release must not fail over a
    # credential a fork will never have.
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Sign for macOS
        # A Developer ID signature makes the Keychain's "Always Allow" survive a
        # version upgrade: the approval is tied to the signing identity rather
        # than to the bytes, which an ad-hoc signature changes on every build.
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          # The password protects a keychain that lives for the length of one
          # job on a throwaway runner; it is not a secret worth having.
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Without this codesign asks for permission to use the key, and a
          # runner has nobody to ask.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

          codesign --force --timestamp --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "target/${{ matrix.target }}/release/ytcli"
          codesign --verify --strict --verbose=2 "target/${{ matrix.target }}/release/ytcli"
      - name: Notarise
        # Gatekeeper quarantines a downloaded binary until Apple has seen it.
        # The ticket binds to the binary's own hash, so it applies to the copy
        # inside the tarball we ship even though only the zip is submitted —
        # `stapler` works on bundles and installers, not on a bare executable.
        if: runner.os == 'macOS' && env.APPLE_API_KEY_P8 != ''
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
          ditto -c -k "target/${{ matrix.target }}/release/ytcli" "$RUNNER_TEMP/notarise.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            --key "$RUNNER_TEMP/key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/key.p8" "$RUNNER_TEMP/notarise.zip"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="ytcli-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/ytcli.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/ytcli" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
  wheels:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64}
          - {os: ubuntu-24.04-arm, target: aarch64}
          - {os: macos-latest, target: aarch64}
          - {os: macos-latest, target: x86_64}
          - {os: windows-latest, target: x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
  release:
    needs: [binaries, wheels]
    runs-on: ubuntu-latest
    # A `workflow_dispatch` run is a rehearsal: everything is built, nothing is
    # published. A pipeline whose publishing half has never run is not a
    # pipeline, and neither is one that can only be tested by publishing.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
  pypi:
    needs: wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    # OIDC: no API token is stored anywhere. PyPI verifies the repository,
    # the workflow filename and this environment.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
  tap:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      # A tap lives in a second repository and `GITHUB_TOKEN` cannot push
      # there. A deploy key is the smallest credential that can: write access
      # to that one repository and nothing else, unlike a personal token, which
      # carries the whole account.
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
      TAP_REPO: git@github.com:ormeilu/homebrew-tap.git
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      # Skipped rather than failed when the key is absent: the tap is an
      # optional channel, and a release must not fail over one.
      - name: Update the Homebrew tap
        if: env.TAP_DEPLOY_KEY != ''
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          sha() { sha256sum "dist/ytcli-$1.tar.gz" | cut -d' ' -f1; }

          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone --depth 1 "$TAP_REPO" tap
          mkdir -p tap/Formula
          cat > tap/Formula/ytcli.rb <<EOF
          # Generated by the ytcli release workflow. Edits here are overwritten.
          class Ytcli < Formula
            desc "Yandex Tracker command-line client, sized for agents"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/ytcli-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "${base}/ytcli-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/ytcli-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "${base}/ytcli-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
            end

            def install
              # The tarball has one top-level directory and Homebrew has already
              # stepped into it, so the binary is right here. Globbing for
              # \`*/ytcli\` finds nothing and fails inside Pathname.
              bin.install "ytcli"
              doc.install "README.md"
              generate_completions_from_executable(bin/"ytcli", "completions")
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/ytcli --version")
            end
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ytcli.rb
          git commit -m "ytcli ${version}" || exit 0
          git push
  crates:
    needs: binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Trusted Publishing, like PyPI: crates.io verifies this repository and
    # workflow over OIDC and hands back a token that lives for the length of
    # this job. No long-lived registry token exists to leak.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Publishing is final: a version on crates.io can be yanked but never
      # replaced. It runs after the binaries build, so a tag that does not
      # compile everywhere never reaches the registry.
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
