[package]
name = "ytcli"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Token-efficient Yandex Tracker CLI for humans and AI agents"
authors = ["Ilya Lubenets <lubenets.ilya.igorevich@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/ormeilu/yandex-tracker-cli"
homepage = "https://ormeilu.github.io/yandex-tracker-cli/"
documentation = "https://ormeilu.github.io/yandex-tracker-cli/"
keywords = ["yandex", "tracker", "cli", "llm", "agent"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/docs", "/skills", "/tests/fixtures"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
backon = "1.6.0"
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
dialoguer = { version = "0.12.0", default-features = false, features = ["password", "fuzzy-select"] }
etcetera = "0.11.0"
figment = { version = "0.10.19", features = ["toml", "env"] }
indicatif = "0.18.6"
jiff = { version = "0.2.35", features = ["serde"] }
keyring = { version = "4.1.6", features = [
  "apple-native-keyring-store",
  "windows-native-keyring-store",
  "zbus-secret-service-keyring-store",
] }
owo-colors = "4.3.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "charset", "http2", "rustls", "multipart", "stream"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tabled = "0.21.0"
termimad = "0.35.2"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros", "fs", "time"] }
toml_edit = "0.25.13"
toon-format = { version = "0.5.0", optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.48.0", features = ["json", "filters"] }
predicates = "3.1.4"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
trycmd = "1.2.1"
wiremock = "0.6.5"

[features]
default = []
# TOON output format (https://toonformat.dev). Experimental: the format is young
# and only pays off on uniform lists, so it stays behind a flag until measured.
toon = ["dep:toon-format"]

[profile.release]
# The binary is invoked dozens of times per agent session; size and startup win
# over compile time.
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Output rendering is the product; an accidental panic in it is a broken command.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Our error enums deliberately carry what makes a message actionable (status
# codes, upstream text). Boxing them to save stack bytes on a path that is about
# to exit the process is not a trade worth making.
result_large_err = "allow"
# Noise from pedantic that does not earn its keep here.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
